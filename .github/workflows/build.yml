name: Build Tubeforge

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Tubeforge-Windows
          - os: macos-latest
            artifact_name: Tubeforge-macOS
          - os: ubuntu-latest
            artifact_name: Tubeforge-Linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: yt-converter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py

      - name: Zip macOS app bundle (preserves .app structure)
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Tubeforge.app Tubeforge-macOS.zip

      - name: Upload artifact (Windows/Linux)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            yt-converter/dist/Tubeforge.exe
            yt-converter/dist/Tubeforge
          if-no-files-found: ignore

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: yt-converter/Tubeforge-macOS.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip_count=$(find "$d" -maxdepth 1 -name "*.zip" | wc -l)
            total_count=$(find "$d" -maxdepth 1 -type f | wc -l)
            if [ "$zip_count" -eq 1 ] && [ "$total_count" -eq 1 ]; then
              cp "$d"/*.zip "../${name}.zip"
            else
              zip -r "../${name}.zip" "$name"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
